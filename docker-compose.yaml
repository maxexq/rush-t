version: '3.8'

networks:
  ticket-network:
    driver: bridge

services:
  # ---------------------------------------------------
  # 1. PostgreSQL (For Go Core Service)
  # ---------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ticket_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ticket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticket-network

  # ---------------------------------------------------
  # 2. Redis (For Rust Flash Sale Service)
  # ---------------------------------------------------
  redis:
    image: redis:alpine
    container_name: ticket_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticket-network

  # ---------------------------------------------------
  # 3. MongoDB (For Logging Service)
  # ---------------------------------------------------
  mongo:
    image: mongo:latest
    container_name: ticket_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ticket-network

  # ---------------------------------------------------
  # 4. Zookeeper (Required for Kafka)
  # ---------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ticket_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ticket-network

  # ---------------------------------------------------
  # 5. Kafka (The Message Broker)
  # ---------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ticket_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Setup listeners for both internal (docker network) and external (localhost) access
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ticket-network

  # ---------------------------------------------------
  # 6. Kafka UI (Optional: For Visualization)
  # Access at http://localhost:8080
  # ---------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ticket_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - ticket-network

  # ---------------------------------------------------
  # 7. Go Core Service
  # ---------------------------------------------------
  core-service:
    build: ./core-service
    container_name: ticket_core_service
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://admin:password123@postgres:5432/ticket_db
    ports:
      - "3000:3000"
    networks:
      - ticket-network

volumes:
  postgres_data:
  redis_data:
  mongo_data: