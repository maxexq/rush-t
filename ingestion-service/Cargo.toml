[package]
name = "ingestion-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["limit", "load-shed", "timeout"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }
jsonwebtoken = "9.2"
dotenvy = "0.15"
chrono = { version = "=0.4.38", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "fat"              # Full LTO for maximum speed
codegen-units = 1         # Single codegen unit = better optimization
strip = true              # Strip symbols to reduce binary size
panic = "abort"           # Abort on panic = no unwinding overhead
overflow-checks = false   # Disable overflow checks in release for speed

[profile.release.build-override]
opt-level = 3

